<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvG</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Разделы">
    <div class="brand">
      <div class="brand-mark" data-icon="zap"></div>
      <div class="brand-name">AvG</div>
    </div>
    <a href="#main" class="nav-item" data-view="main"><span data-icon="zap"></span>Оптимизация</a>
    <a href="#apps" class="nav-item" data-view="apps"><span data-icon="grid"></span>Приложения</a>
    <a href="#console" class="nav-item" data-view="console"><span data-icon="terminal"></span>Консоль ADB</a>
    <a href="#history" class="nav-item" data-view="history"><span data-icon="history"></span>История и откат</a>
    <a href="#settings" class="nav-item" data-view="settings"><span data-icon="sliders"></span>Настройки</a>
    <div class="grow"></div>
    <div id="device-chip" class="device-chip"></div>
  </nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="drop-overlay" class="drop-overlay" hidden>
  <div class="drop-box"><span data-icon="download"></span>Отпустите, чтобы установить APK</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
