name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v0.1.0). Должен уже существовать.'
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-зависимости
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Тесты ядра
        run: cargo test -p avg-core

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'AvG ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'Скачайте установщик для своей системы. Рядом с AvG понадобится папка platform-tools (см. README).'
          releaseDraft: false
